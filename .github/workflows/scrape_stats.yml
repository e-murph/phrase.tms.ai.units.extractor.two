name: Phrase AI Scraper

on:
  schedule:
    - cron: '0 16 * * 0'  # Automatic: Sundays at 4pm UTC
  workflow_dispatch:      # Manual: Adds button to GitHub

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- 1. RUN THE PYTHON SCRIPT TO SCRAPE AND TRANSFORM DATA FROM PHRASE TMS  ---
      - name: Run scraper
        env:
          PHRASE_API_URL: ${{ secrets.PHRASE_API_URL }}
          PHRASE_REFERER: ${{ secrets.PHRASE_REFERER }}
          PHRASE_API_URL_WORDS: ${{ secrets.PHRASE_API_URL_WORDS }}
          PHRASE_REFERER_WORDS: ${{ secrets.PHRASE_REFERER_WORDS }}
        run: python main.py

      # --- 2. ZIP AND SEND ALL LOGS TO THE WORKFLOW TEAM  ---
      - name: Zip Excel Reports
        run: |
          shopt -s nullglob
          files=( *.xlsx )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Excel files found. Skipping Weekly_Phrase_Usage_Reports.zip creation."
            exit 0
          fi

          zip Weekly_Phrase_Usage_Reports.zip "${files[@]}"

      - name: Send Email with Zip Attachment
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde
        with:
          # SMTP Server Configuration (Default is Gmail)
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          
          # Credentials from GitHub Secrets
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          
          # Email Metadata
          subject: "Weekly Phrase Usage Reports"
          
          # Who to send to (Comma separated for multiple addresses)
          to: eoin.murphy@vistatec.com
          
          from: "Vistatec Phrase Report Automation"
          
          # The body of the email
          body: |
            Hi All,

            Attached are the latest Phrase usage logs generated for this week.

            - Product Logs
            - Language Logs
            - Unmapped Projects
            - Master Data File

            This is an automated message generated by GitHub Actions.

          attachments: "Weekly_Phrase_Usage_Reports.zip"

      # --- 3. ZIP AND SEND PRODUCT LOGS TO SUSE PM TEAM ---
      - name: Zip Product Reports
        run: |
          shopt -s nullglob
          files=( SUSE_Cloud-Native_Product_*.xlsx )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No SUSE Product Excel files found. Skipping Weekly_Phrase_SUSE_Cloud-Native_Usage_Reports.zip creation."
            exit 0
          fi

          zip Weekly_Phrase_SUSE_Cloud-Native_Usage_Reports.zip "${files[@]}"

      - name: Send Product Email
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          
          subject: "Weekly Phrase SUSE Cloud-Native Usage Reports"
          
          # Primary recipient
          to: eoin.murphy@vistatec.com
          
          # --- ADD YOUR CC HERE ---
          # You can add one address, or comma-separate multiple addresses
          # cc: user1@company.com, user2@company.com
          
          from: "Vistatec Phrase Report Automation"
          body: |
            Hi All,
            
            Attached is the ZIP file containing the SUSE Cloud-Native Product Usage logs generated for this week.
            
            ---
            Please do not reply to this email, as this inbox is unmonitored. 
            If you have any questions about these reports, please contact the Workflow Dept at workflowdept@vistatec.com.
            
            This is an automated message generated directly from GitHub Actions.
          
          attachments: "Weekly_Phrase_SUSE_Cloud-Native_Usage_Reports.zip"